<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pitch Correction App</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .controls { margin-bottom: 20px; }
    button { padding: 10px 18px; font-size: 14px; margin: 0 5px; cursor: pointer; border: none; border-radius: 4px; background: #007acc; color: white; }
    button:disabled { background: #555; cursor: not-allowed; }
    #editor { border: 1px solid #444; background: #252526; margin: 0 auto; display: block; cursor: pointer; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Pitch Corrector (Melodyne Style)</h1>
  
  <div class="controls">
    <button id="recBtn">録音開始</button>
    <button id="playBtn" disabled>再生</button>
  </div>

  <canvas id="editor" width="800" height="300"></canvas>
  <div class="status" id="statusText">録音ボタンを押して声を録音してください。</div>

  <script>
    let audioCtx;
    let mediaRecorder;
    let audioChunks = [];
    let audioBuffer = null;
    let pitchOffset = 0; // 半音単位のシフト量

    const recBtn = document.getElementById('recBtn');
    const playBtn = document.getElementById('playBtn');
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    // 初期のグリッド描画
    drawEditor();

    // 録音処理
    recBtn.addEventListener('click', async () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recBtn.textContent = '録音開始';
        statusText.textContent = '録音完了。波形をドラッグしてピッチを変更できます。';
      } else {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/wav' });
          const arrayBuffer = await blob.arrayBuffer();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          playBtn.disabled = false;
          pitchOffset = 0;
          drawEditor();
        };

        mediaRecorder.start();
        recBtn.textContent = '録音停止';
        statusText.textContent = '録音中...';
      }
    });

    // 再生処理（ピッチ変更を反映）
    playBtn.addEventListener('click', () => {
      if (!audioBuffer) return;
      
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;

      // ピッチ補正（再生速度・周波数変更）
      // playbackRate = 2 ^ (semitones / 12)
      source.playbackRate.value = Math.pow(2, pitchOffset / 12);

      source.connect(audioCtx.destination);
      source.start();
    });

    // エディタ（Canvas）の描画
    function drawEditor() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ガイド線描画（ノートのライン）
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 音声データブロック描画
      if (audioBuffer) {
        const centerY = canvas.height / 2;
        const blockY = centerY - (pitchOffset * 15); // 1半音あたり15px移動

        ctx.fillStyle = '#0e80d0';
        ctx.fillRect(100, blockY - 20, 600, 40);
        
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`ピッチ補正: ${pitchOffset > 0 ? '+' : ''}${pitchOffset} 半音`, 400, blockY + 5);
      } else {
        ctx.fillStyle = '#666';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ここに録音データが表示されます', 400, 150);
      }
    }

    // ドラッグでピッチ変更
    let isDragging = false;
    let startY = 0;

    canvas.addEventListener('mousedown', (e) => {
      if (!audioBuffer) return;
      isDragging = true;
      startY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaY = startY - e.clientY;
      const semitoneChange = Math.round(deltaY / 15);
      if (semitoneChange !== 0) {
        pitchOffset += semitoneChange;
        startY = e.clientY;
        drawEditor();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
