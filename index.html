<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Melodyne Style Pitch Editor</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 15px; box-sizing: border-box; }
    .controls { margin-bottom: 12px; }
    button { padding: 12px 18px; font-size: 15px; font-weight: bold; margin: 4px; cursor: pointer; border: none; border-radius: 6px; background: #007acc; color: white; -webkit-tap-highlight-color: transparent; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #downloadBtn { background: #28a745; }
    #downloadBtn:disabled { background: #444; }
    #canvas-container { width: 100%; max-width: 900px; margin: 0 auto; touch-action: none; position: relative; }
    #editor { width: 100%; height: 380px; border: 1px solid #444; background: #252526; display: block; border-radius: 6px; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Melodyne Style Pitch Editor</h1>
  
  <div class="controls">
    <button id="recBtn">録音開始</button>
    <button id="playBtn" disabled>再生</button>
    <button id="downloadBtn" disabled>WAVダウンロード</button>
  </div>

  <div id="canvas-container">
    <canvas id="editor" width="900" height="380"></canvas>
  </div>
  <div class="status" id="statusText">【1本指】ブロック移動 / 【2本指】画面の音域上下スクロール</div>

  <script>
    let audioCtx;
    let mediaRecorder;
    let audioChunks = [];
    let audioBuffer = null;
    let notes = [];
    let selectedNote = null;

    const KEY_WIDTH = 70;
    const DISPLAY_NOTES = 25; // 1画面に表示する鍵盤数（約2オクターブ）
    let baseMidi = 60;        // 画面一番下のMIDIノート番号（初期値: C4）

    const recBtn = document.getElementById('recBtn');
    const playBtn = document.getElementById('playBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    drawEditor();

    // 録音処理
    recBtn.addEventListener('click', async () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recBtn.textContent = '録音開始';
        statusText.textContent = '解析中...';
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const arrayBuffer = await blob.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            analyzeAudioNotes();
            playBtn.disabled = false;
            downloadBtn.disabled = false;
            statusText.textContent = '編集後、「WAVダウンロード」で書き出せます。';
            drawEditor();
          };

          mediaRecorder.start();
          recBtn.textContent = '録音停止';
          statusText.textContent = '録音中... 声を出してください。';
        } catch (err) {
          statusText.textContent = 'マイクのアクセスを許可してください。';
        }
      }
    });

    // 簡易ピッチ検出
    function analyzeAudioNotes() {
      notes = [];
      if (!audioBuffer) return;

      const data = audioBuffer.getChannelData(0);
      const sampleRate = audioBuffer.sampleRate;
      const chunkSize = Math.floor(sampleRate * 0.1);
      const totalChunks = Math.floor(data.length / chunkSize);

      let currentNote = null;
      let detectedMidiss = [];

      for (let i = 0; i < totalChunks; i++) {
        const startSample = i * chunkSize;
        const slice = data.subarray(startSample, startSample + chunkSize);
        const midi = detectPitchMIDI(slice, sampleRate);

        if (midi !== null) {
          detectedMidiss.push(midi);
          if (currentNote && currentNote.midi === midi) {
            currentNote.lengthSamples += chunkSize;
            currentNote.duration += 0.1;
          } else {
            if (currentNote) notes.push(currentNote);
            currentNote = {
              id: Date.now() + i,
              startSample: startSample,
              lengthSamples: chunkSize,
              startTime: i * 0.1,
              duration: 0.1,
              midi: midi,
              offset: 0
            };
          }
        } else {
          if (currentNote) {
            notes.push(currentNote);
            currentNote = null;
          }
        }
      }
      if (currentNote) notes.push(currentNote);

      if (detectedMidiss.length > 0) {
        const avgMidi = Math.round(detectedMidiss.reduce((a, b) => a + b) / detectedMidiss.length);
        baseMidi = Math.max(36, Math.min(84, avgMidi - Math.floor(DISPLAY_NOTES / 2)));
      }
    }

    function detectPitchMIDI(buffer, sampleRate) {
      let sum = 0;
      for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
      let rms = Math.sqrt(sum / buffer.length);
      if (rms < 0.02) return null;

      let r1 = 0, r2 = buffer.length - 1, thres = 0.2;
      for (let i = 0; i < buffer.length / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < buffer.length / 2; i++) if (Math.abs(buffer[buffer.length - i]) < thres) { r2 = buffer.length - i; break; }
      let sliced = buffer.subarray(r1, r2);

      let c = new Float32Array(sliced.length);
      for (let i = 0; i < sliced.length; i++) {
        for (let j = 0; j < sliced.length - i; j++) {
          c[i] += sliced[j] * sliced[j + i];
        }
      }

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < sliced.length; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      if (maxpos === -1) return null;

      let freq = sampleRate / maxpos;
      if (freq < 80 || freq > 1200) return null;

      return Math.round(12 * Math.log2(freq / 440) + 69);
    }

    // 再生処理
    playBtn.addEventListener('click', () => {
      if (!audioBuffer) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      let currentTime = audioCtx.currentTime;

      notes.forEach(note => {
        const sliceBuffer = audioCtx.createBuffer(1, note.lengthSamples, audioBuffer.sampleRate);
        sliceBuffer.getChannelData(0).set(audioBuffer.getChannelData(0).subarray(note.startSample, note.startSample + note.lengthSamples));

        const source = audioCtx.createBufferSource();
        source.buffer = sliceBuffer;

        const rate = Math.pow(2, note.offset / 12);
        source.playbackRate.value = rate;

        source.connect(audioCtx.destination);
        source.start(currentTime);
        currentTime += (note.duration / rate);
      });
    });

    // WAVファイル生成・ダウンロード処理
    downloadBtn.addEventListener('click', async () => {
      if (!audioBuffer) return;
      statusText.textContent = 'WAVファイルをレンダリング中...';

      const sampleRate = audioBuffer.sampleRate;
      // 全体の長さを計算
      const maxEndTime = Math.max(...notes.map(n => n.startTime + (n.duration / Math.pow(2, n.offset / 12))));
      const offlineCtx = new OfflineAudioContext(1, Math.ceil(sampleRate * (maxEndTime + 0.5)), sampleRate);

      notes.forEach(note => {
        const sliceBuffer = offlineCtx.createBuffer(1, note.lengthSamples, sampleRate);
        sliceBuffer.getChannelData(0).set(audioBuffer.getChannelData(0).subarray(note.startSample, note.startSample + note.lengthSamples));

        const source = offlineCtx.createBufferSource();
        source.buffer = sliceBuffer;

        const rate = Math.pow(2, note.offset / 12);
        source.playbackRate.value = rate;

        source.connect(offlineCtx.destination);
        source.start(note.startTime);
      });

      const renderedBuffer = await offlineCtx.startRendering();
      const wavBlob = audioBufferToWav(renderedBuffer);
      
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pitch_corrected.wav';
      a.click();

      statusText.textContent = 'WAVファイルのダウンロードが完了しました！';
    });

    // AudioBufferをWAV形式のBlobに変換するヘルパー関数
    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; // PCM
      const bitDepth = 16;
      
      let samples = buffer.getChannelData(0);
      let length = samples.length * 2 + 44;
      let bufferArray = new ArrayBuffer(length);
      let view = new DataView(bufferArray);

      let pos = 0;
      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(pos++, str.charCodeAt(i));
        }
      }

      writeString('RIFF');
      view.setUint32(pos, length - 8, true); pos += 4;
      writeString('WAVE');

      writeString('fmt ');
      view.setUint32(pos, 16, true); pos += 4;
      view.setUint16(pos, format, true); pos += 2;
      view.setUint16(pos, numOfChan, true); pos += 2;
      view.setUint32(pos, sampleRate, true); pos += 4;
      view.setUint32(pos, sampleRate * numOfChan * (bitDepth / 8), true); pos += 4;
      view.setUint16(pos, numOfChan * (bitDepth / 8), true); pos += 2;
      view.setUint16(pos, bitDepth, true); pos += 2;

      writeString('data');
      view.setUint32(pos, length - pos - 4, true); pos += 4;

      for (let i = 0; i < samples.length; i++, pos += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view.buffer], { type: 'audio/wav' });
    }

    // 画面描画
    function drawEditor() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const noteHeight = canvas.height / DISPLAY_NOTES;
      const maxMidi = baseMidi + DISPLAY_NOTES - 1;

      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);

        ctx.fillStyle = isBlack ? '#1a1a1a' : '#252526';
        ctx.fillRect(KEY_WIDTH, y, canvas.width - KEY_WIDTH, noteHeight);

        ctx.strokeStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(KEY_WIDTH, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const noteIndex = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);

        ctx.fillStyle = isBlack ? '#111' : '#eee';
        ctx.fillRect(0, y, KEY_WIDTH - 2, noteHeight - 1);

        if (noteIndex === 0 || noteIndex === 5 || noteIndex === 7) {
          ctx.fillStyle = isBlack ? '#fff' : '#000';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'right';
          let label = noteNames[noteIndex] + Math.floor(midi / 12 - 1);
          if (midi === 72) label = "hiC (C5)";
          if (midi === 77) label = "hiF (F5)";
          if (midi === 79) label = "hiG (G5)";
          ctx.fillText(label, KEY_WIDTH - 6, y + noteHeight - 3);
        }
      }

      if (audioBuffer && notes.length > 0) {
        const totalDuration = audioBuffer.duration;
        const timelineWidth = canvas.width - KEY_WIDTH;

        notes.forEach(note => {
          const currentMidi = note.midi + note.offset;
          
          if (currentMidi >= baseMidi && currentMidi <= maxMidi) {
            const yIndex = maxMidi - currentMidi;
            const y = yIndex * noteHeight;
            const x = KEY_WIDTH + (note.startTime / totalDuration) * timelineWidth;
            const w = (note.duration / totalDuration) * timelineWidth;

            note.renderX = x;
            note.renderY = y;
            note.renderW = w;
            note.renderH = noteHeight;

            ctx.fillStyle = (note.offset !== 0) ? '#ff9500' : '#00bfff';
            ctx.fillRect(x + 1, y + 1, Math.max(w - 2, 4), noteHeight - 2);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'left';
            const name = noteNames[currentMidi % 12];
            if (w > 20) ctx.fillText(name, x + 4, y + noteHeight - 3);
          } else {
            note.renderX = -999;
          }
        });
      } else if (!audioBuffer) {
        ctx.fillStyle = '#666';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ここに音階ブロックが表示されます', (canvas.width + KEY_WIDTH) / 2, canvas.height / 2);
      }
    }

    // タッチ＆マウス操作ハンドラ
    let isDragging = false;
    let isTwoFingerScroll = false;
    let startY = 0;
    let twoFingerStartY = 0;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
      };
    }

    function handleStart(e) {
      if (e.touches && e.touches.length === 2) {
        isTwoFingerScroll = true;
        isDragging = false;
        selectedNote = null;
        twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        if (e.cancelable) e.preventDefault();
        return;
      }

      const pos = getCanvasCoords(e);
      if (pos.x < KEY_WIDTH) return;

      selectedNote = notes.find(n => 
        pos.x >= n.renderX && pos.x <= n.renderX + n.renderW
      );

      if (selectedNote) {
        isDragging = true;
        isTwoFingerScroll = false;
        startY = pos.y;
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleMove(e) {
      if (isTwoFingerScroll && e.touches && e.touches.length === 2) {
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const deltaY = currentY - twoFingerStartY;
        const noteHeight = canvas.height / DISPLAY_NOTES;

        const shift = Math.round(deltaY / (noteHeight * 1.2));
        if (shift !== 0) {
          baseMidi = Math.max(24, Math.min(96, baseMidi + shift));
          twoFingerStartY = currentY;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
        return;
      }

      if (isDragging && selectedNote) {
        const pos = getCanvasCoords(e);
        const noteHeight = canvas.height / DISPLAY_NOTES;
        
        const deltaY = startY - pos.y;
        const semitoneShift = Math.round(deltaY / noteHeight);

        if (semitoneShift !== 0) {
          selectedNote.offset += semitoneShift;
          startY = pos.y;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleEnd(e) {
      if (e.touches && e.touches.length === 0) {
        isDragging = false;
        isTwoFingerScroll = false;
        selectedNote = null;
      } else if (e.touches && e.touches.length === 1) {
        isTwoFingerScroll = false;
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);
  </script>
</body>
</html>
