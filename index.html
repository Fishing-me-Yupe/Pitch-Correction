<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Melodyne Style Pitch Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 15px; box-sizing: border-box; }
    .controls { margin-bottom: 12px; }
    button { padding: 12px 18px; font-size: 15px; font-weight: bold; margin: 4px; cursor: pointer; border: none; border-radius: 6px; background: #007acc; color: white; -webkit-tap-highlight-color: transparent; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #downloadBtn { background: #28a745; }
    #downloadBtn:disabled { background: #444; }
    #resetBtn { background: #dc3545; }
    #resetBtn:disabled { background: #444; }
    #canvas-container { width: 100%; max-width: 900px; margin: 0 auto; touch-action: none; position: relative; }
    #editor { width: 100%; height: 380px; border: 1px solid #444; background: #252526; display: block; border-radius: 6px; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Melodyne Style Pitch Editor</h1>
  
  <div class="controls">
    <button id="recBtn">録音開始</button>
    <button id="playBtn" disabled>再生</button>
    <button id="resetBtn" disabled>ピッチリセット</button>
    <button id="downloadBtn" disabled>WAVダウンロード</button>
  </div>

  <div id="canvas-container">
    <canvas id="editor" width="900" height="380"></canvas>
  </div>
  <div class="status" id="statusText">【1本指ドラッグ】波形の一部を直接上下に変形 / 【2本指】画面の音域スクロール</div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let audioBuffer = null;
    let pitchCurvePoints = []; // 1秒間に120回の高精度ピッチ・音量データ
    let rawPitchPoints = []; // リセット用オリジナルデータ

    const KEY_WIDTH = 70;
    const DISPLAY_NOTES = 25;
    let baseMidi = 60;

    const recBtn = document.getElementById('recBtn');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    drawEditor();

    // 録音処理
    recBtn.addEventListener('click', async () => {
      await Tone.start();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recBtn.textContent = '録音開始';
        statusText.textContent = '解析中...';
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const arrayBuffer = await blob.arrayBuffer();
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await actx.decodeAudioData(arrayBuffer);
            
            analyzeAudioNotes();
            playBtn.disabled = false;
            resetBtn.disabled = false;
            downloadBtn.disabled = false;
            statusText.textContent = '波形の一部分をドラッグして「びよーん」と自由に変形できます。';
            drawEditor();
          };

          mediaRecorder.start();
          recBtn.textContent = '録音停止';
          statusText.textContent = '録音中... 声を出してください。';
        } catch (err) {
          statusText.textContent = 'マイクのアクセスを許可してください。';
        }
      }
    });

    // 高精細ピッチ＆音量解析（1秒あたり120回サンプリング）
    function analyzeAudioNotes() {
      pitchCurvePoints = [];
      if (!audioBuffer) return;

      const data = audioBuffer.getChannelData(0);
      const sampleRate = audioBuffer.sampleRate;
      
      const samplesPerFrame = Math.floor(sampleRate / 120);
      const windowSize = Math.floor(sampleRate * 0.04);
      const totalFrames = Math.floor((data.length - windowSize) / samplesPerFrame);

      let detectedMidiss = [];

      for (let i = 0; i < totalFrames; i++) {
        const startSample = i * samplesPerFrame;
        const slice = data.subarray(startSample, startSample + windowSize);
        
        let sum = 0;
        for (let j = 0; j < slice.length; j++) sum += slice[j] * slice[j];
        let rms = Math.sqrt(sum / slice.length);

        const midiFloat = detectPitchMIDIFloat(slice, sampleRate);
        const time = startSample / sampleRate;

        pitchCurvePoints.push({
          time: time,
          originalMidi: midiFloat,
          midi: midiFloat,
          rms: rms
        });

        if (midiFloat !== null) {
          detectedMidiss.push(midiFloat);
        }
      }

      rawPitchPoints = JSON.parse(JSON.stringify(pitchCurvePoints));

      if (detectedMidiss.length > 0) {
        const avgMidi = Math.round(detectedMidiss.reduce((a, b) => a + b) / detectedMidiss.length);
        baseMidi = Math.max(36, Math.min(84, avgMidi - Math.floor(DISPLAY_NOTES / 2)));
      }
    }

    // 連続的な周波数（MIDI小数値）の検出
    function detectPitchMIDIFloat(buffer, sampleRate) {
      let sum = 0;
      for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
      let rms = Math.sqrt(sum / buffer.length);
      if (rms < 0.015) return null;

      let r1 = 0, r2 = buffer.length - 1, thres = 0.2;
      for (let i = 0; i < buffer.length / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < buffer.length / 2; i++) if (Math.abs(buffer[buffer.length - i]) < thres) { r2 = buffer.length - i; break; }
      let sliced = buffer.subarray(r1, r2);

      let c = new Float32Array(sliced.length);
      for (let i = 0; i < sliced.length; i++) {
        for (let j = 0; j < sliced.length - i; j++) {
          c[i] += sliced[j] * sliced[j + i];
        }
      }

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < sliced.length; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      if (maxpos === -1) return null;

      let freq = sampleRate / maxpos;
      if (freq < 80 || freq > 1200) return null;

      return 12 * Math.log2(freq / 440) + 69;
    }

    // ピッチリセット機能
    resetBtn.addEventListener('click', () => {
      pitchCurvePoints = JSON.parse(JSON.stringify(rawPitchPoints));
      drawEditor();
      statusText.textContent = 'ピッチカーブを初期状態に戻しました。';
    });

    // 再生処理（フレームごとに動的なピッチ変化をリアルタイム反映）
    let isPlaying = false;
    playBtn.addEventListener('click', async () => {
      if (!audioBuffer || isPlaying) return;
      await Tone.start();

      isPlaying = true;
      playBtn.disabled = true;

      const duration = audioBuffer.duration;
      const toneBuffer = new Tone.ToneAudioBuffer(audioBuffer);
      
      const pitchShift = new Tone.PitchShift({ pitch: 0 }).toDestination();
      const player = new Tone.Player(toneBuffer).connect(pitchShift);

      const startTime = Tone.now();
      player.start(startTime);

      const updateInterval = setInterval(() => {
        const elapsed = Tone.now() - startTime;
        if (elapsed >= duration) {
          clearInterval(updateInterval);
          player.dispose();
          pitchShift.dispose();
          isPlaying = false;
          playBtn.disabled = false;
          drawEditor();
          return;
        }

        // 現在時間における変更後ピッチと元ピッチの差分（半音）をリアルタイム適用
        const currentPt = pitchCurvePoints.find(p => p.time >= elapsed);
        if (currentPt && currentPt.midi !== null && currentPt.originalMidi !== null) {
          pitchShift.pitch = currentPt.midi - currentPt.originalMidi;
        } else {
          pitchShift.pitch = 0;
        }

        drawEditor(elapsed / duration);
      }, 10);
    });

    // WAVダウンロード処理（滑らかに変更されたピッチカーブを直接反映）
    downloadBtn.addEventListener('click', async () => {
      if (!audioBuffer) return;
      statusText.textContent = 'WAVファイルをレンダリング中...';

      const sampleRate = audioBuffer.sampleRate;
      const duration = audioBuffer.duration;
      const offlineCtx = new Tone.OfflineAudioContext(
        audioBuffer.numberOfChannels,
        duration * sampleRate,
        sampleRate
      );

      const outputBuffer = offlineCtx.createBuffer(audioBuffer.numberOfChannels, audioBuffer.length, sampleRate);
      
      for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
        const inputData = audioBuffer.getChannelData(channel);
        const outputData = outputBuffer.getChannelData(channel);

        let currentFrameIdx = 0;
        for (let i = 0; i < inputData.length; i++) {
          const time = i / sampleRate;
          while (currentFrameIdx < pitchCurvePoints.length - 1 && pitchCurvePoints[currentFrameIdx + 1].time <= time) {
            currentFrameIdx++;
          }
          
          const pt = pitchCurvePoints[currentFrameIdx];
          let semitoneShift = 0;
          if (pt && pt.midi !== null && pt.originalMidi !== null) {
            semitoneShift = pt.midi - pt.originalMidi;
          }

          if (semitoneShift === 0) {
            outputData[i] = inputData[i];
          } else {
            // ピッチ変更に伴う波形のリサンプリング
            const factor = Math.pow(2, semitoneShift / 12);
            const srcIdx = Math.floor(i * factor) % inputData.length;
            outputData[i] = inputData[srcIdx];
          }
        }
      }

      const wavBlob = audioBufferToWav(outputBuffer);
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pitch_deformed.wav';
      a.click();

      statusText.textContent = 'WAVファイルのダウンロードが完了しました！';
    });

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      
      let samples = buffer.getChannelData(0);
      let length = samples.length * 2 + 44;
      let bufferArray = new ArrayBuffer(length);
      let view = new DataView(bufferArray);

      let pos = 0;
      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(pos++, str.charCodeAt(i));
        }
      }

      writeString('RIFF');
      view.setUint32(pos, length - 8, true); pos += 4;
      writeString('WAVE');

      writeString('fmt ');
      view.setUint32(pos, 16, true); pos += 4;
      view.setUint16(pos, format, true); pos += 2;
      view.setUint16(pos, numOfChan, true); pos += 2;
      view.setUint32(pos, sampleRate, true); pos += 4;
      view.setUint32(pos, sampleRate * numOfChan * (bitDepth / 8), true); pos += 4;
      view.setUint16(pos, numOfChan * (bitDepth / 8), true); pos += 2;
      view.setUint16(pos, bitDepth, true); pos += 2;

      writeString('data');
      view.setUint32(pos, length - pos - 4, true); pos += 4;

      for (let i = 0; i < samples.length; i++, pos += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view.buffer], { type: 'audio/wav' });
    }

    // 画面描画
    function drawEditor(playProgress = null) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const noteHeight = canvas.height / DISPLAY_NOTES;
      const maxMidi = baseMidi + DISPLAY_NOTES - 1;

      // グリッド描画
      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);

        ctx.fillStyle = isBlack ? '#1a1a1a' : '#252526';
        ctx.fillRect(KEY_WIDTH, y, canvas.width - KEY_WIDTH, noteHeight);

        ctx.strokeStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(KEY_WIDTH, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 鍵盤描画
      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const noteIndex = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);

        ctx.fillStyle = isBlack ? '#111' : '#eee';
        ctx.fillRect(0, y, KEY_WIDTH - 2, noteHeight - 1);

        if (noteIndex === 0 || noteIndex === 5 || noteIndex === 7) {
          ctx.fillStyle = isBlack ? '#fff' : '#000';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'right';
          let label = noteNames[noteIndex] + Math.floor(midi / 12 - 1);
          if (midi === 72) label = "hiC (C5)";
          if (midi === 77) label = "hiF (F5)";
          if (midi === 79) label = "hiG (G5)";
          ctx.fillText(label, KEY_WIDTH - 6, y + noteHeight - 3);
        }
      }

      if (audioBuffer && pitchCurvePoints.length > 0) {
        const totalDuration = audioBuffer.duration;
        const timelineWidth = canvas.width - KEY_WIDTH;

        // 1. 音量振幅ボディ（Blob）の描画
        let maxRmsGlobal = Math.max(...pitchCurvePoints.map(p => p.rms)) || 0.01;
        ctx.fillStyle = 'rgba(211, 84, 0, 0.45)';
        ctx.strokeStyle = 'rgba(243, 156, 18, 0.8)';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        let isTopDrawing = false;
        
        // 上側の輪郭
        pitchCurvePoints.forEach(pt => {
          if (pt.midi !== null) {
            const px = KEY_WIDTH + (pt.time / totalDuration) * timelineWidth;
            const py = (maxMidi - pt.midi) * noteHeight + noteHeight / 2;
            const ampHeight = (pt.rms / maxRmsGlobal) * noteHeight * 0.95;

            if (!isTopDrawing) {
              ctx.moveTo(px, py - ampHeight / 2);
              isTopDrawing = true;
            } else {
              ctx.lineTo(px, py - ampHeight / 2);
            }
          } else {
            isTopDrawing = false;
          }
        });

        // 下側の輪郭
        for (let i = pitchCurvePoints.length - 1; i >= 0; i--) {
          const pt = pitchCurvePoints[i];
          if (pt.midi !== null) {
            const px = KEY_WIDTH + (pt.time / totalDuration) * timelineWidth;
            const py = (maxMidi - pt.midi) * noteHeight + noteHeight / 2;
            const ampHeight = (pt.rms / maxRmsGlobal) * noteHeight * 0.95;
            ctx.lineTo(px, py + ampHeight / 2);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 2. 赤色/黄色の心電図ピッチ波形の描画（変形が「びよーん」と見えるように描画）
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 3;
        ctx.beginPath();
        let isCurveDrawing = false;

        pitchCurvePoints.forEach(pt => {
          if (pt.midi !== null) {
            const px = KEY_WIDTH + (pt.time / totalDuration) * timelineWidth;
            const py = (maxMidi - pt.midi) * noteHeight + noteHeight / 2;

            if (!isCurveDrawing) {
              ctx.moveTo(px, py);
              isCurveDrawing = true;
            } else {
              ctx.lineTo(px, py);
            }
          } else {
            isCurveDrawing = false;
          }
        });
        ctx.stroke();

        // 再生ヘッド
        if (playProgress !== null) {
          const playX = KEY_WIDTH + playProgress * timelineWidth;
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(playX, 0);
          ctx.lineTo(playX, canvas.height);
          ctx.stroke();
        }

      } else if (!audioBuffer) {
        ctx.fillStyle = '#666';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ここに波形とピッチカーブが表示されます', (canvas.width + KEY_WIDTH) / 2, canvas.height / 2);
      }
    }

    // 「びよーん」と滑らかにピッチを変形（Deform）させるインタラクション
    let isDragging = false;
    let isTwoFingerScroll = false;
    let dragCenterIdx = -1;
    let startY = 0;
    let twoFingerStartY = 0;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
      };
    }

    function handleStart(e) {
      if (e.touches && e.touches.length === 2) {
        isTwoFingerScroll = true;
        isDragging = false;
        twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        if (e.cancelable) e.preventDefault();
        return;
      }

      const pos = getCanvasCoords(e);
      if (pos.x < KEY_WIDTH || !audioBuffer || pitchCurvePoints.length === 0) return;

      const totalDuration = audioBuffer.duration;
      const timelineWidth = canvas.width - KEY_WIDTH;
      const clickedTime = ((pos.x - KEY_WIDTH) / timelineWidth) * totalDuration;

      // クリック位置に最も近いピッチサンプリング点を検索
      let closestIdx = -1;
      let minDistance = Infinity;

      pitchCurvePoints.forEach((pt, idx) => {
        if (pt.midi !== null) {
          const dist = Math.abs(pt.time - clickedTime);
          if (dist < minDistance) {
            minDistance = dist;
            closestIdx = idx;
          }
        }
      });

      if (closestIdx !== -1 && minDistance < 0.25) { // 近くに波形が存在する場合
        isDragging = true;
        isTwoFingerScroll = false;
        dragCenterIdx = closestIdx;
        startY = pos.y;
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleMove(e) {
      if (isTwoFingerScroll && e.touches && e.touches.length === 2) {
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const deltaY = currentY - twoFingerStartY;
        const noteHeight = canvas.height / DISPLAY_NOTES;

        const shift = Math.round(deltaY / (noteHeight * 1.2));
        if (shift !== 0) {
          baseMidi = Math.max(24, Math.min(96, baseMidi + shift));
          twoFingerStartY = currentY;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
        return;
      }

      if (isDragging && dragCenterIdx !== -1) {
        const pos = getCanvasCoords(e);
        const noteHeight = canvas.height / DISPLAY_NOTES;
        
        // 移動量をMIDI（ピッチ）の変化量に変換
        const deltaY = startY - pos.y;
        const midiDelta = deltaY / noteHeight;

        if (Math.abs(midiDelta) > 0.01) {
          // 選択位置周辺（影響範囲）のピッチをガウス関数的に「びよーん」と連続変形
          const influenceRadius = 18; // 変形の影響を及ぼすフレーム幅（約15フレーム = 約0.12秒間）

          for (let i = -influenceRadius; i <= influenceRadius; i++) {
            const targetIdx = dragCenterIdx + i;
            if (targetIdx >= 0 && targetIdx < pitchCurvePoints.length) {
              const pt = pitchCurvePoints[targetIdx];
              if (pt.midi !== null) {
                // ガウス鐘型曲線による滑らかな引き伸ばし補間
                const factor = Math.exp(-Math.pow(i / (influenceRadius / 2), 2));
                pt.midi += midiDelta * factor;
              }
            }
          }

          startY = pos.y;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleEnd(e) {
      if (!e.touches || e.touches.length === 0) {
        isDragging = false;
        isTwoFingerScroll = false;
        dragCenterIdx = -1;
      } else if (e.touches && e.touches.length === 1) {
        isTwoFingerScroll = false;
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);
  </script>
</body>
</html>
