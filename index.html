<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Waveform Pitch Editor</title>
  <!-- 音声を伸ばさずピッチだけ変えるための高機能ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 15px; box-sizing: border-box; }
    .controls { margin-bottom: 12px; }
    button { padding: 12px 18px; font-size: 15px; font-weight: bold; margin: 4px; cursor: pointer; border: none; border-radius: 6px; background: #007acc; color: white; -webkit-tap-highlight-color: transparent; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #downloadBtn { background: #28a745; }
    #downloadBtn:disabled { background: #444; }
    #canvas-container { width: 100%; max-width: 900px; margin: 0 auto; touch-action: none; position: relative; }
    #editor { width: 100%; height: 380px; border: 1px solid #444; background: #252526; display: block; border-radius: 6px; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Waveform Pitch Editor</h1>
  
  <div class="controls">
    <button id="recBtn">録音開始</button>
    <button id="playBtn" disabled>再生</button>
    <button id="downloadBtn" disabled>WAVダウンロード</button>
  </div>

  <div id="canvas-container">
    <canvas id="editor" width="900" height="380"></canvas>
  </div>
  <div class="status" id="statusText">【1本指となぞり】波形上でピッチ変更 / 【2本指】画面の音域スクロール</div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let audioBuffer = null;
    
    // ピッチマップ（時間軸ごとの半音シフト量）
    const RESOLUTION = 300; // 時間軸の解像度
    let pitchMap = new Array(RESOLUTION).fill(0);

    const KEY_WIDTH = 70;
    const DISPLAY_NOTES = 25; // 画面に表示する鍵盤数
    let baseMidi = 60;        // 画面一番下のMIDIノート番号 (C4)

    const recBtn = document.getElementById('recBtn');
    const playBtn = document.getElementById('playBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    drawEditor();

    // 録音処理
    recBtn.addEventListener('click', async () => {
      await Tone.start();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recBtn.textContent = '録音開始';
        statusText.textContent = '処理中...';
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const arrayBuffer = await blob.arrayBuffer();
            const ctx = new AudioContext();
            audioBuffer = await ctx.decodeAudioData(arrayBuffer);
            
            // 初期化
            pitchMap = new Array(RESOLUTION).fill(0);
            playBtn.disabled = false;
            downloadBtn.disabled = false;
            statusText.textContent = '波形の上をドラッグ／スワイプして特定の部分の音の高さを変更できます。';
            drawEditor();
          };

          mediaRecorder.start();
          recBtn.textContent = '録音停止';
          statusText.textContent = '録音中...';
        } catch (err) {
          statusText.textContent = 'マイクのアクセスを許可してください。';
        }
      }
    });

    // スピードを変えずにピッチだけ変更して再生
    let isPlaying = false;
    playBtn.addEventListener('click', async () => {
      if (!audioBuffer || isPlaying) return;
      await Tone.start();

      isPlaying = true;
      playBtn.disabled = true;

      const toneBuffer = new Tone.ToneAudioBuffer(audioBuffer);
      const player = new Tone.GrainPlayer(toneBuffer).toDestination();
      player.grainSize = 0.1;
      player.overlap = 0.05;

      const duration = audioBuffer.duration;
      const startTime = Tone.now();

      player.start(startTime);

      // 時間経過に合わせてリアルタイムにピッチシフトを更新
      const updateInterval = setInterval(() => {
        const elapsed = Tone.now() - startTime;
        if (elapsed >= duration) {
          clearInterval(updateInterval);
          player.dispose();
          isPlaying = false;
          playBtn.disabled = false;
          drawEditor();
          return;
        }

        const progress = elapsed / duration;
        const index = Math.floor(progress * RESOLUTION);
        if (index >= 0 && index < RESOLUTION) {
          player.pitchShift = pitchMap[index];
        }
        
        // 再生位置線の描画
        drawEditor(progress);
      }, 20);
    });

    // 画面描画（波形 ＋ 鍵盤 ＋ ピッチライン）
    function drawEditor(playProgress = null) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const noteHeight = canvas.height / DISPLAY_NOTES;
      const maxMidi = baseMidi + DISPLAY_NOTES - 1;
      const timelineWidth = canvas.width - KEY_WIDTH;

      // 1. 背景グリッド
      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);

        ctx.fillStyle = isBlack ? '#1a1a1a' : '#252526';
        ctx.fillRect(KEY_WIDTH, y, timelineWidth, noteHeight);

        ctx.strokeStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(KEY_WIDTH, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 2. 左側のピアノ鍵盤
      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const noteIndex = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);

        ctx.fillStyle = isBlack ? '#111' : '#eee';
        ctx.fillRect(0, y, KEY_WIDTH - 2, noteHeight - 1);

        if (noteIndex === 0 || noteIndex === 5 || noteIndex === 7) {
          ctx.fillStyle = isBlack ? '#fff' : '#000';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'right';
          let label = noteNames[noteIndex] + Math.floor(midi / 12 - 1);
          if (midi === 72) label = "hiC (C5)";
          if (midi === 77) label = "hiF (F5)";
          if (midi === 79) label = "hiG (G5)";
          ctx.fillText(label, KEY_WIDTH - 6, y + noteHeight - 3);
        }
      }

      // 3. 音声データの波形描画（途切れず連続表示）
      if (audioBuffer) {
        const rawData = audioBuffer.getChannelData(0);
        const step = Math.ceil(rawData.length / timelineWidth);
        const centerY = canvas.height / 2;
        const amp = canvas.height / 3;

        ctx.beginPath();
        ctx.strokeStyle = '#00bfff';
        ctx.lineWidth = 1.5;

        for (let i = 0; i < timelineWidth; i++) {
          const sampleIndex = i * step;
          let min = 1.0, max = -1.0;
          for (let j = 0; j < step; j++) {
            const datum = rawData[sampleIndex + j];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
          }
          ctx.moveTo(KEY_WIDTH + i, centerY + (min * amp));
          ctx.lineTo(KEY_WIDTH + i, centerY + (max * amp));
        }
        ctx.stroke();

        // 4. ピッチ変更ライン（オレンジ線）の描画
        ctx.beginPath();
        ctx.strokeStyle = '#ff9500';
        ctx.lineWidth = 3;

        for (let i = 0; i < RESOLUTION; i++) {
          const x = KEY_WIDTH + (i / RESOLUTION) * timelineWidth;
          const shift = pitchMap[i];
          // ピッチ0は中央位置
          const y = centerY - (shift * (noteHeight));

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 再生位置バー
        if (playProgress !== null) {
          const playX = KEY_WIDTH + playProgress * timelineWidth;
          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(playX, 0);
          ctx.lineTo(playX, canvas.height);
          ctx.stroke();
        }

      } else {
        ctx.fillStyle = '#666';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ここに連続波形が表示されます', (canvas.width + KEY_WIDTH) / 2, canvas.height / 2);
      }
    }

    // タッチ＆マウス操作（ドラッグでピッチラインを引く）
    let isDragging = false;
    let isTwoFingerScroll = false;
    let twoFingerStartY = 0;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
      };
    }

    function updatePitchFromPos(pos) {
      if (pos.x < KEY_WIDTH || !audioBuffer) return;

      const timelineWidth = canvas.width - KEY_WIDTH;
      const progress = (pos.x - KEY_WIDTH) / timelineWidth;
      const index = Math.floor(progress * RESOLUTION);

      if (index >= 0 && index < RESOLUTION) {
        const centerY = canvas.height / 2;
        const noteHeight = canvas.height / DISPLAY_NOTES;
        
        // Y座標から半音の移動量を計算
        const semitoneShift = Math.round((centerY - pos.y) / noteHeight);
        pitchMap[index] = Math.max(-24, Math.min(24, semitoneShift));

        // 滑らかにつなぐ補正
        if (index > 0 && pitchMap[index - 1] !== undefined) {
          pitchMap[index - 1] = Math.round((pitchMap[index - 1] + pitchMap[index]) / 2);
        }
        drawEditor();
      }
    }

    function handleStart(e) {
      if (e.touches && e.touches.length === 2) {
        isTwoFingerScroll = true;
        isDragging = false;
        twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        if (e.cancelable) e.preventDefault();
        return;
      }

      const pos = getCanvasCoords(e);
      if (pos.x >= KEY_WIDTH) {
        isDragging = true;
        isTwoFingerScroll = false;
        updatePitchFromPos(pos);
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleMove(e) {
      if (isTwoFingerScroll && e.touches && e.touches.length === 2) {
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const deltaY = currentY - twoFingerStartY;
        const noteHeight = canvas.height / DISPLAY_NOTES;

        const shift = Math.round(deltaY / (noteHeight * 1.2));
        if (shift !== 0) {
          baseMidi = Math.max(24, Math.min(96, baseMidi + shift));
          twoFingerStartY = currentY;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
        return;
      }

      if (isDragging) {
        const pos = getCanvasCoords(e);
        updatePitchFromPos(pos);
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleEnd(e) {
      if (!e.touches || e.touches.length === 0) {
        isDragging = false;
        isTwoFingerScroll = false;
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);

    // WAV書き出し
    downloadBtn.addEventListener('click', async () => {
      if (!audioBuffer) return;
      statusText.textContent = 'レンダリング中...';

      const duration = audioBuffer.duration;
      const sampleRate = audioBuffer.sampleRate;

      const renderedBuffer = await Tone.Offline(async () => {
        const toneBuffer = new Tone.ToneAudioBuffer(audioBuffer);
        const player = new Tone.GrainPlayer(toneBuffer).toDestination();
        player.grainSize = 0.1;
        player.overlap = 0.05;

        player.start(0);

        // 時間経過でピッチシフト値を書き出し
        for (let i = 0; i < RESOLUTION; i++) {
          const time = (i / RESOLUTION) * duration;
          const shift = pitchMap[i];
          player.pitchShift = shift;
        }
      }, duration);

      const wavBlob = audioBufferToWav(renderedBuffer.get());
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pitch_corrected.wav';
      a.click();

      statusText.textContent = 'ダウンロード完了！';
    });

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      
      let samples = buffer.getChannelData(0);
      let length = samples.length * 2 + 44;
      let bufferArray = new ArrayBuffer(length);
      let view = new DataView(bufferArray);

      let pos = 0;
      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(pos++, str.charCodeAt(i));
        }
      }

      writeString('RIFF');
      view.setUint32(pos, length - 8, true); pos += 4;
      writeString('WAVE');

      writeString('fmt ');
      view.setUint32(pos, 16, true); pos += 4;
      view.setUint16(pos, format, true); pos += 2;
      view.setUint16(pos, numOfChan, true); pos += 2;
      view.setUint32(pos, sampleRate, true); pos += 4;
      view.setUint32(pos, sampleRate * numOfChan * (bitDepth / 8), true); pos += 4;
      view.setUint16(pos, numOfChan * (bitDepth / 8), true); pos += 2;
      view.setUint16(pos, bitDepth, true); pos += 2;

      writeString('data');
      view.setUint32(pos, length - pos - 4, true); pos += 4;

      for (let i = 0; i < samples.length; i++, pos += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view.buffer], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
