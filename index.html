<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Melodyne Style Pitch Editor High Quality</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 15px; box-sizing: border-box; }
    .controls { margin-bottom: 12px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }
    button, label.btn { padding: 10px 16px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; background: #007acc; color: white; -webkit-tap-highlight-color: transparent; display: inline-flex; align-items: center; gap: 4px; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #madBtn { background: #9b59b6; }
    #downloadBtn { background: #28a745; }
    #downloadBtn:disabled { background: #444; }
    #resetBtn { background: #dc3545; }
    #resetBtn:disabled { background: #444; }
    #fileInput { display: none; }
    
    .lock-container { display: inline-flex; align-items: center; gap: 6px; background: #333; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; user-select: none; }
    .lock-container input { cursor: pointer; }

    #canvas-container { width: 100%; max-width: 900px; margin: 0 auto; touch-action: none; position: relative; }
    #editor { width: 100%; height: 380px; border: 1px solid #444; background: #252526; display: block; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Melodyne Style Pitch Editor</h1>
  
  <div class="controls">
    <label class="lock-container">
      <input type="checkbox" id="recLock"> 録音ロック
    </label>
    <button id="recBtn">録音開始</button>
    <label class="btn" for="fileInput">ファイル読み込み</label>
    <input type="file" id="fileInput" accept="audio/*,video/*,video/mp4,.wav,.mp3,.mp4,.mov,.webm">
    
    <button id="playBtn" disabled>再生</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="madBtn" disabled>MAD化 (Auto-Tune)</button>
    <button id="resetBtn" disabled>リセット</button>
    <button id="downloadBtn" disabled>WAV出力</button>
  </div>

  <div id="canvas-container">
    <canvas id="editor" width="900" height="380"></canvas>
  </div>
  <div class="status" id="statusText">【クリック/タップ】任意の再生位置を指定 / 【ドラッグ】波形を変形 / 【2本指】スクロール</div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let audioBuffer = null;
    let pitchCurvePoints = [];
    let rawPitchPoints = [];

    const KEY_WIDTH = 70;
    const DISPLAY_NOTES = 25;
    let baseMidi = 60;

    // 再生状態管理
    let isPlaying = false;
    let currentPlayTime = 0;
    let activePlayer = null;
    let activePitchShift = null;
    let animationFrameId = null;

    const recLock = document.getElementById('recLock');
    const recBtn = document.getElementById('recBtn');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const madBtn = document.getElementById('madBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    drawEditor();

    // 音声・動画ファイル読み込み
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopAudio();
      statusText.textContent = 'メディアファイルを解析中...';
      try {
        const arrayBuffer = await file.arrayBuffer();
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        audioBuffer = await actx.decodeAudioData(arrayBuffer);
        
        analyzeAudioNotes();
        enableControls();
        currentPlayTime = 0;
        statusText.textContent = '読み込み完了。ピッチ編集や「MAD化」が可能です。';
        drawEditor();
      } catch (err) {
        console.error(err);
        statusText.textContent = 'ファイルの読み込みに失敗しました。';
      }
    });

    // 録音ロック機能
    recLock.addEventListener('change', () => {
      if (recLock.checked) {
        recBtn.disabled = true;
      } else {
        recBtn.disabled = false;
      }
    });

    // 録音処理
    recBtn.addEventListener('click', async () => {
      if (recLock.checked) return;
      await Tone.start();
      stopAudio();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recBtn.textContent = '録音開始';
        statusText.textContent = '解析中...';
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const arrayBuffer = await blob.arrayBuffer();
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await actx.decodeAudioData(arrayBuffer);
            
            analyzeAudioNotes();
            enableControls();
            currentPlayTime = 0;
            statusText.textContent = '録音完了。波形を変形したり「MAD化」ボタンを試してください。';
            drawEditor();
          };

          mediaRecorder.start();
          recBtn.textContent = '録音停止';
          statusText.textContent = '録音中...';
        } catch (err) {
          statusText.textContent = 'マイクのアクセスを許可してください。';
        }
      }
    });

    function enableControls() {
      playBtn.disabled = false;
      stopBtn.disabled = false;
      madBtn.disabled = false;
      resetBtn.disabled = false;
      downloadBtn.disabled = false;
    }

    // ピッチ解析（録音開始時の異常高音跳ね上がり防止補正つき）
    function analyzeAudioNotes() {
      pitchCurvePoints = [];
      if (!audioBuffer) return;

      const data = audioBuffer.getChannelData(0);
      const sampleRate = audioBuffer.sampleRate;
      
      const samplesPerFrame = Math.floor(sampleRate / 120);
      const windowSize = Math.floor(sampleRate * 0.04);
      const totalFrames = Math.floor((data.length - windowSize) / samplesPerFrame);

      // 開始約0.3秒間のポップノイズ/過大入力対策期間
      const initialGuardFrames = Math.floor(0.3 * 120);

      let detectedMidiss = [];

      for (let i = 0; i < totalFrames; i++) {
        const startSample = i * samplesPerFrame;
        const slice = data.subarray(startSample, startSample + windowSize);
        const time = startSample / sampleRate;

        let midiFloat = detectPitchYIN(slice, sampleRate);

        // 録音最初期の極端な高音スパイクを検出して補正除去
        if (i < initialGuardFrames && midiFloat !== null) {
          if (midiFloat > 82) { // hiC以上の異常跳ね上がりをキャンセル
            midiFloat = null;
          }
        }

        pitchCurvePoints.push({
          time: time,
          originalMidi: midiFloat,
          midi: midiFloat
        });

        if (midiFloat !== null) {
          detectedMidiss.push(midiFloat);
        }
      }

      smoothPitchCurve();
      rawPitchPoints = JSON.parse(JSON.stringify(pitchCurvePoints));

      if (detectedMidiss.length > 0) {
        const avgMidi = Math.round(detectedMidiss.reduce((a, b) => a + b) / detectedMidiss.length);
        baseMidi = Math.max(36, Math.min(84, avgMidi - Math.floor(DISPLAY_NOTES / 2)));
      }
    }

    // YIN アルゴリズム
    function detectPitchYIN(buffer, sampleRate) {
      let sum = 0;
      for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
      let rms = Math.sqrt(sum / buffer.length);
      if (rms < 0.015) return null;

      const yinBuffer = new Float32Array(Math.floor(buffer.length / 2));
      for (let tau = 0; tau < yinBuffer.length; tau++) {
        for (let i = 0; i < yinBuffer.length; i++) {
          const delta = buffer[i] - buffer[i + tau];
          yinBuffer[tau] += delta * delta;
        }
      }

      let runningSum = 0;
      yinBuffer[0] = 1;
      for (let tau = 1; tau < yinBuffer.length; tau++) {
        runningSum += yinBuffer[tau];
        yinBuffer[tau] *= tau / runningSum;
      }

      const threshold = 0.15;
      let tauFound = -1;
      for (let tau = 2; tau < yinBuffer.length; tau++) {
        if (yinBuffer[tau] < threshold) {
          while (tau + 1 < yinBuffer.length && yinBuffer[tau + 1] < yinBuffer[tau]) {
            tau++;
          }
          tauFound = tau;
          break;
        }
      }

      if (tauFound === -1) return null;

      const freq = sampleRate / tauFound;
      if (freq < 75 || freq > 1000) return null;

      return 12 * Math.log2(freq / 440) + 69;
    }

    // 先頭・途中の飛び跳ねノイズ補正
    function smoothPitchCurve() {
      for (let i = 1; i < pitchCurvePoints.length - 1; i++) {
        const prev = pitchCurvePoints[i - 1].midi;
        const curr = pitchCurvePoints[i].midi;
        const next = pitchCurvePoints[i + 1].midi;

        if (curr !== null && prev !== null && next !== null) {
          if (Math.abs(curr - prev) > 4 && Math.abs(curr - next) > 4) {
            pitchCurvePoints[i].midi = (prev + next) / 2;
          }
        }
      }
    }

    // 喋り声をMAD風にするAuto-Tune機能
    madBtn.addEventListener('click', () => {
      if (!audioBuffer) return;
      
      // 連続した音程を正確な音階（半音単位）へクオンタイズ
      pitchCurvePoints.forEach(pt => {
        if (pt.midi !== null) {
          pt.midi = Math.round(pt.midi);
        }
      });

      drawEditor();
      statusText.textContent = '喋り声を音MAD風（Auto-Tune）に補正しました。';
    });

    resetBtn.addEventListener('click', () => {
      pitchCurvePoints = JSON.parse(JSON.stringify(rawPitchPoints));
      drawEditor();
      statusText.textContent = 'ピッチカーブをリセットしました。';
    });

    // トランスポート再生 / 一時停止
    playBtn.addEventListener('click', async () => {
      if (!audioBuffer) return;
      await Tone.start();

      if (isPlaying) {
        pauseAudio();
      } else {
        startAudio(currentPlayTime);
      }
    });

    // 完全停止
    stopBtn.addEventListener('click', () => {
      stopAudio();
      currentPlayTime = 0;
      drawEditor();
    });

    function startAudio(offsetTime = 0) {
      if (!audioBuffer) return;
      stopAudio();

      isPlaying = true;
      playBtn.textContent = '一時停止';

      const duration = audioBuffer.duration;
      if (offsetTime >= duration) offsetTime = 0;

      const toneBuffer = new Tone.ToneAudioBuffer(audioBuffer);
      activePitchShift = new Tone.PitchShift({ pitch: 0 }).toDestination();
      activePitchShift.windowSize = 0.08;
      
      activePlayer = new Tone.Player(toneBuffer).connect(activePitchShift);

      const startTime = Tone.now() - offsetTime;
      activePlayer.start(Tone.now(), offsetTime);

      function loop() {
        if (!isPlaying) return;
        const elapsed = Tone.now() - startTime;
        currentPlayTime = elapsed;

        if (elapsed >= duration) {
          stopAudio();
          currentPlayTime = 0;
          drawEditor();
          return;
        }

        const currentPt = pitchCurvePoints.find(p => p.time >= elapsed);
        if (currentPt && currentPt.midi !== null && currentPt.originalMidi !== null) {
          activePitchShift.pitch = currentPt.midi - currentPt.originalMidi;
        }

        drawEditor(elapsed / duration);
        animationFrameId = requestAnimationFrame(loop);
      }
      loop();
    }

    function pauseAudio() {
      if (activePlayer) {
        try { activePlayer.stop(); } catch(e){}
      }
      isPlaying = false;
      playBtn.textContent = '再生';
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function stopAudio() {
      pauseAudio();
      if (activePlayer) {
        try { activePlayer.dispose(); } catch(e){}
        activePlayer = null;
      }
      if (activePitchShift) {
        try { activePitchShift.dispose(); } catch(e){}
        activePitchShift = null;
      }
    }

    // WAV出力・ダウンロード
    downloadBtn.addEventListener('click', async () => {
      if (!audioBuffer) return;
      statusText.textContent = 'WAVファイルを生成中...';

      try {
        const sampleRate = audioBuffer.sampleRate;
        const numChannels = audioBuffer.numberOfChannels;
        const length = audioBuffer.length;

        const actx = new (window.AudioContext || window.webkitAudioContext)();
        const outBuffer = actx.createBuffer(numChannels, length, sampleRate);

        for (let ch = 0; ch < numChannels; ch++) {
          const inputData = audioBuffer.getChannelData(ch);
          const outputData = outBuffer.getChannelData(ch);
          
          let readPos = 0;
          for (let i = 0; i < length; i++) {
            const time = i / sampleRate;
            const frameIdx = Math.min(
              pitchCurvePoints.length - 1,
              Math.floor(time * 120)
            );
            const pt = pitchCurvePoints[frameIdx];

            let shift = 0;
            if (pt && pt.midi !== null && pt.originalMidi !== null) {
              shift = pt.midi - pt.originalMidi;
            }

            const speed = Math.pow(2, shift / 12);
            readPos += speed;
            
            const srcIdx = Math.floor(readPos) % length;
            outputData[i] = inputData[srcIdx];
          }
        }

        const wavBlob = audioBufferToWav(outBuffer);
        const url = URL.createObjectURL(wavBlob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'pitch_edited_mad.wav';
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 200);

        statusText.textContent = 'WAVファイルのダウンロードが完了しました！';
      } catch (err) {
        console.error(err);
        statusText.textContent = 'ダウンロードエラーが発生しました。';
      }
    });

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      
      let samples = buffer.getChannelData(0);
      let dataLength = samples.length * 2;
      let bufferArray = new ArrayBuffer(44 + dataLength);
      let view = new DataView(bufferArray);

      let pos = 0;
      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(pos++, str.charCodeAt(i));
        }
      }

      writeString('RIFF');
      view.setUint32(pos, 36 + dataLength, true); pos += 4;
      writeString('WAVE');

      writeString('fmt ');
      view.setUint32(pos, 16, true); pos += 4;
      view.setUint16(pos, format, true); pos += 2;
      view.setUint16(pos, numOfChan, true); pos += 2;
      view.setUint32(pos, sampleRate, true); pos += 4;
      view.setUint32(pos, sampleRate * numOfChan * (bitDepth / 8), true); pos += 4;
      view.setUint16(pos, numOfChan * (bitDepth / 8), true); pos += 2;
      view.setUint16(pos, bitDepth, true); pos += 2;

      writeString('data');
      view.setUint32(pos, dataLength, true); pos += 4;

      for (let i = 0; i < samples.length; i++, pos += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    // 画面描画
    function drawEditor(playProgress = null) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const noteHeight = canvas.height / DISPLAY_NOTES;
      const maxMidi = baseMidi + DISPLAY_NOTES - 1;

      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);

        ctx.fillStyle = isBlack ? '#1a1a1a' : '#252526';
        ctx.fillRect(KEY_WIDTH, y, canvas.width - KEY_WIDTH, noteHeight);

        ctx.strokeStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(KEY_WIDTH, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      for (let i = 0; i < DISPLAY_NOTES; i++) {
        const midi = maxMidi - i;
        const y = i * noteHeight;
        const noteIndex = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);

        ctx.fillStyle = isBlack ? '#111' : '#eee';
        ctx.fillRect(0, y, KEY_WIDTH - 2, noteHeight - 1);

        if (noteIndex === 0 || noteIndex === 5 || noteIndex === 7) {
          ctx.fillStyle = isBlack ? '#fff' : '#000';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'right';
          let label = noteNames[noteIndex] + Math.floor(midi / 12 - 1);
          if (midi === 72) label = "hiC (C5)";
          if (midi === 77) label = "hiF (F5)";
          if (midi === 79) label = "hiG (G5)";
          ctx.fillText(label, KEY_WIDTH - 6, y + noteHeight - 3);
        }
      }

      if (audioBuffer && pitchCurvePoints.length > 0) {
        const totalDuration = audioBuffer.duration;
        const timelineWidth = canvas.width - KEY_WIDTH;

        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 3;
        ctx.beginPath();
        let isCurveDrawing = false;

        pitchCurvePoints.forEach(pt => {
          if (pt.midi !== null) {
            const px = KEY_WIDTH + (pt.time / totalDuration) * timelineWidth;
            const py = (maxMidi - pt.midi) * noteHeight + noteHeight / 2;

            if (!isCurveDrawing) {
              ctx.moveTo(px, py);
              isCurveDrawing = true;
            } else {
              ctx.lineTo(px, py);
            }
          } else {
            isCurveDrawing = false;
          }
        });
        ctx.stroke();

        // 現在の再生位置ヘッダー（水色ライン）
        const currentProgress = playProgress !== null ? playProgress : (currentPlayTime / totalDuration);
        const playX = KEY_WIDTH + currentProgress * timelineWidth;
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(playX, 0);
        ctx.lineTo(playX, canvas.height);
        ctx.stroke();

      } else if (!audioBuffer) {
        ctx.fillStyle = '#666';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ここに波形とピッチカーブが表示されます', (canvas.width + KEY_WIDTH) / 2, canvas.height / 2);
      }
    }

    // インタラクション（任意の再生位置指定 / ドラッグ変形）
    let isDragging = false;
    let isTwoFingerScroll = false;
    let dragCenterIdx = -1;
    let startY = 0;
    let twoFingerStartY = 0;
    let hasMovedDuringTouch = false;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
      };
    }

    function handleStart(e) {
      hasMovedDuringTouch = false;

      if (e.touches && e.touches.length === 2) {
        isTwoFingerScroll = true;
        isDragging = false;
        twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        if (e.cancelable) e.preventDefault();
        return;
      }

      const pos = getCanvasCoords(e);
      if (pos.x < KEY_WIDTH || !audioBuffer || pitchCurvePoints.length === 0) return;

      const totalDuration = audioBuffer.duration;
      const timelineWidth = canvas.width - KEY_WIDTH;
      const clickedTime = ((pos.x - KEY_WIDTH) / timelineWidth) * totalDuration;

      let closestIdx = -1;
      let minDistance = Infinity;

      pitchCurvePoints.forEach((pt, idx) => {
        if (pt.midi !== null) {
          const dist = Math.abs(pt.time - clickedTime);
          if (dist < minDistance) {
            minDistance = dist;
            closestIdx = idx;
          }
        }
      });

      // 波形の近くを選択した場合は変形ドラッグ、それ以外は再生位置の移動
      if (closestIdx !== -1 && minDistance < 0.2) {
        isDragging = true;
        isTwoFingerScroll = false;
        dragCenterIdx = closestIdx;
        startY = pos.y;
      } else {
        // クリックした任意の場所に再生ヘッドを移動して再生開始
        currentPlayTime = clickedTime;
        if (isPlaying) {
          startAudio(currentPlayTime);
        } else {
          drawEditor();
        }
      }
      if (e.cancelable) e.preventDefault();
    }

    function handleMove(e) {
      hasMovedDuringTouch = true;

      if (isTwoFingerScroll && e.touches && e.touches.length === 2) {
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const deltaY = currentY - twoFingerStartY;
        const noteHeight = canvas.height / DISPLAY_NOTES;

        const shift = Math.round(deltaY / (noteHeight * 1.2));
        if (shift !== 0) {
          baseMidi = Math.max(24, Math.min(96, baseMidi + shift));
          twoFingerStartY = currentY;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
        return;
      }

      if (isDragging && dragCenterIdx !== -1) {
        const pos = getCanvasCoords(e);
        const noteHeight = canvas.height / DISPLAY_NOTES;
        
        const deltaY = startY - pos.y;
        const midiDelta = deltaY / noteHeight;

        if (Math.abs(midiDelta) > 0.01) {
          const influenceRadius = 24;

          for (let i = -influenceRadius; i <= influenceRadius; i++) {
            const targetIdx = dragCenterIdx + i;
            if (targetIdx >= 0 && targetIdx < pitchCurvePoints.length) {
              const pt = pitchCurvePoints[targetIdx];
              if (pt.midi !== null) {
                const factor = Math.exp(-Math.pow(i / (influenceRadius / 2.2), 2));
                pt.midi += midiDelta * factor;
              }
            }
          }

          startY = pos.y;
          drawEditor();
        }
        if (e.cancelable) e.preventDefault();
      }
    }

    function handleEnd(e) {
      if (!e.touches || e.touches.length === 0) {
        isDragging = false;
        isTwoFingerScroll = false;
        dragCenterIdx = -1;
      } else if (e.touches && e.touches.length === 1) {
        isTwoFingerScroll = false;
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);
  </script>
</body>
</html>
